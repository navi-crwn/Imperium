# Imperium, pintu utama: hanya lewat Tailscale.
# Listen di IP Tailscale VPS saja, jadi dari internet publik tidak ada apa pun di port ini.
# DNS: imperium.hel.ink  A  100.80.122.59  (Cloudflare, "DNS only", bukan proxied)
# Sertifikat: Let's Encrypt lewat DNS-01 (certbot-dns-cloudflare), karena origin cert
# Cloudflare tidak dipercaya browser kalau diakses langsung. Lihat tahap0-sudo.sh.
server {
    listen 100.80.122.59:80;
    server_name imperium.hel.ink;
    return 301 https://$server_name$request_uri;
}
server {
    listen 100.80.122.59:443 ssl http2;
    server_name imperium.hel.ink;
    ssl_certificate     /etc/letsencrypt/live/imperium.hel.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imperium.hel.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/imperium.access.log;
    error_log  /var/log/nginx/imperium.error.log;
    # Imperium sends these three itself, so with add_header alone each one went out twice. nginx keeps
    # setting them, because its own answers (502 while Imperium is down, 403 from the allow list below)
    # need them too, and drops the copy that comes from the app.
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 64m;

    # Jaga-jaga: tolak apa pun yang bukan dari tailnet (100.64.0.0/10)
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-HOP-Door tailscale;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
