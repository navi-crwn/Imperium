{{template "head" .}}
<link rel="stylesheet" href="/static/hop/hop-float.css">
<div data-hop-float aria-hidden="true"></div>
<main class="login-wrap"><div class="login">
  <img class="login-logo" src="/static/imperium.svg" alt="">
  <span class="brand brand-xl">IMPERIUM</span>
  <p class="muted login-tagline">{{t "tagline"}}</p>
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  <div class="card login-card">
    <div class="login-door"><span class="dot ok"></span><span class="mono">{{.Data.Door}}</span><span class="chip">{{.Data.DoorKind}}</span></div>
    <h1>{{t "login.title"}}</h1>
    <p class="muted small">{{t "login.sub"}}</p>
    {{if .Data.Enabled}}<a class="btn primary big login-btn" href="/auth/sso?next={{.Data.Next}}">{{t "login.button"}}</a>{{else}}<p class="flash err">{{t "login.off"}}</p>{{end}}
    <div class="login-facts"><span>HOP ID</span><span>2FA</span><span>{{t "login.audited"}}</span></div>
  </div>
</div></main>
<footer>{{t "footer"}} · v{{.Version}}</footer>
<script src="/static/hop/hop-float.js" defer></script>
</body></html>
