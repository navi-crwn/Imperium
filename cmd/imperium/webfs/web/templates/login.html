{{template "head" .}}
<div class="hop-float" data-hop-float aria-hidden="true">
  <div class="hop-sprite hop-theme-0"><div class="hop-tile"><span class="hop-face"><img src="/static/linkhop.png" alt="" draggable="false"></span></div></div>
  <div class="hop-sprite hop-theme-2"><div class="hop-tile"><span class="hop-face"><svg viewBox="0 0 32 32" shape-rendering="crispEdges" fill="#fff"><path d="M4 0h4v4H4zM24 0h4v4h-4zM4 4h4v4H4zM24 4h4v4h-4zM4 8h8v4H4zM20 8h8v4h-8zM4 12h24v4H4zM0 16h8v4H0zM12 16h8v4h-8zM24 16h8v4h-8zM0 20h32v4H0zM4 24h24v4H4zM8 28h16v4H8z"/></svg></span></div></div>
  <div class="hop-sprite hop-theme-1"><div class="hop-tile"><span class="hop-face"><svg viewBox="0 0 32 32" shape-rendering="crispEdges" fill="#fff"><path d="M8 0h4v4H8zM20 0h4v4h-4zM8 4h4v4H8zM20 4h4v4h-4zM4 8h16v4H4zM4 12h24v4H4zM4 16h4v4H4zM20 16h8v4h-8zM4 20h24v4H4zM4 24h4v4H4zM16 24h12v4H16zM4 28h4v4H4zM12 28h16v4H12z"/></svg></span></div></div>
  <div class="hop-sprite hop-theme-4"><div class="hop-tile"><span class="hop-face"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14Z"/><path d="M5 19c3-4 6-7 10-9"/></svg></span></div></div>
  <div class="hop-sprite hop-theme-3"><div class="hop-tile"><span class="hop-face"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M4.5 9.5a11 11 0 0 1 15 0"/><path d="M7.5 13a7 7 0 0 1 9 0"/><path d="M10.5 16.3a3 3 0 0 1 3 0"/><circle cx="12" cy="19.5" r="1" fill="#fff" stroke="none"/></svg></span></div></div>
  <div class="hop-sprite hop-theme-5"><div class="hop-tile"><span class="hop-face"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 8.5 7.2 12l4.8-6 4.8 6L21 8.5 19.4 18H4.6L3 8.5Zm2.4 11h13.2v1.6H5.4V19.5Z"/></svg></span></div></div>
</div>
<main class="login-wrap"><div class="login">
  <div class="login-crown"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8.5 7.2 12l4.8-6 4.8 6L21 8.5 19.4 18H4.6L3 8.5Zm2.4 11h13.2v1.6H5.4V19.5Z"/></svg></div>
  <span class="brand brand-xl">IMPERIUM</span>
  <p class="muted login-tagline">{{t "tagline"}}</p>
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  <div class="card login-card">
    <div class="login-door"><span class="dot ok"></span><span class="mono">{{.Data.Door}}</span><span class="chip">{{.Data.DoorKind}}</span></div>
    <h1>{{t "login.title"}}</h1>
    <p class="muted small">{{t "login.sub"}}</p>
    {{if .Data.Enabled}}<a class="btn primary big login-btn" href="/auth/sso?next={{.Data.Next}}">{{t "login.button"}}</a>{{else}}<p class="flash err">{{t "login.off"}}</p>{{end}}
    <div class="login-facts"><span>HOP ID</span><span>2FA</span><span>{{t "login.audited"}}</span></div>
  </div>
</div></main>
<footer>{{t "footer"}} · v{{.Version}}</footer>
<script src="/static/hop-float.js" defer></script>
</body></html>
